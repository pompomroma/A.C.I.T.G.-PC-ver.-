appId: com.actig.assistant
productName: ACTIG
directories:
  output: ../../installer/output
  buildResources: build
files:
  - out/**/*
  - resources/**/*
# The frozen Python core + native wallpaper helper + bundled voice models are added as
# extra resources by installer/build.mjs before electron-builder runs.
extraResources:
  - from: ../../installer/staging/backend
    to: backend
  - from: ../../installer/staging/native
    to: native
  - from: ../../assets
    to: assets
win:
  target:
    - nsis
  artifactName: ACTIG-Setup.${ext}
  # requestedExecutionLevel handled by the NSIS include (autostart + wallpaper need it)
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: ../../installer/nsis/installer.nsh
  # Run-on-boot is registered both by Electron's login item and the Task Scheduler job
  # created in installer.nsh, so ACTIG survives reboots permanently (requirement 1).
mac:
  target: dmg
  category: public.app-category.productivity
linux:
  target: AppImage
