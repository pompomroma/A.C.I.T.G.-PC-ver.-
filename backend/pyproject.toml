[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "actig"
version = "0.1.0"
description = "ACTIG agent core — hybrid-brain local agentic AI for PC"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "pydantic>=2.6",
    "SQLAlchemy>=2.0",
    "anthropic>=0.40",
    "ollama>=0.3",
    "langdetect>=1.0.9",
    "httpx>=0.27",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Voice stack — heavy, optional so the core can run/test without audio hardware.
voice = [
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
    "openwakeword>=0.6",
    "webrtcvad>=2.0.10",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
]
# Windows system-control stack — only installs on Windows.
windows = [
    "pywin32>=306; sys_platform == 'win32'",
    "uiautomation>=2.0; sys_platform == 'win32'",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
]
# Web automation for music / browser settings.
web = [
    "playwright>=1.44",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
actig = "actig.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["actig*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Put the backend dir on sys.path so `import actig` and `from tests.fakes import ...`
# resolve when pytest is run from the backend directory (as CI does).
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
