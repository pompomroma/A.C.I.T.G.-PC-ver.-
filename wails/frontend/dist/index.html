<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACTIG</title>
    <style>
      :root {
        --cyan: #8af6ff;
        --glow: 0 0 24px rgba(25, 182, 214, 0.55);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #d8fbff;
        background: radial-gradient(circle at 50% 30%, #06222e, #03080e 70%);
        user-select: none;
      }
      .card {
        text-align: center;
        padding: 36px 44px;
        border: 1px solid rgba(138, 246, 255, 0.35);
        border-radius: 18px;
        background: rgba(8, 26, 36, 0.6);
        box-shadow: var(--glow);
        backdrop-filter: blur(6px);
      }
      h1 { font-size: 44px; margin: 0 0 4px; letter-spacing: 6px; color: var(--cyan); }
      .sub { opacity: 0.7; margin-bottom: 22px; font-size: 14px; letter-spacing: 1px; }
      input, button {
        font-size: 15px;
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid rgba(138, 246, 255, 0.4);
        background: rgba(0, 0, 0, 0.25);
        color: #d8fbff;
        outline: none;
      }
      button { cursor: pointer; background: linear-gradient(180deg, #19b6d6, #0d7e96); color: #001018; font-weight: 700; }
      #reply { margin-top: 18px; min-height: 22px; font-size: 16px; color: var(--cyan); }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>ACTIG</h1>
      <div class="sub">Wails edition · phase-1 foundation</div>
      <div>
        <input id="name" placeholder="your name" />
        <button onclick="greet()">Wake</button>
      </div>
      <div id="reply"></div>
    </div>
    <script>
      // Wails injects window.go.main.App.* bindings at runtime (see app.go).
      async function greet() {
        const name = document.getElementById("name").value;
        try {
          const msg = await window.go.main.App.Greet(name);
          document.getElementById("reply").textContent = msg;
        } catch (e) {
          document.getElementById("reply").textContent = "Backend not ready: " + e;
        }
      }
    </script>
  </body>
</html>
