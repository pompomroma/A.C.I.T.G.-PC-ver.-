name: Build ACTIG installer

# Produces the single-file deliverable `ACTIG-Setup.exe`.
# After a run finishes, download it from the run's "Artifacts" section (no local toolchain
# needed). Tagging a release also attaches the exe to the GitHub Release.

on:
  push:
    branches: ["claude/local-agentic-ai-pc-td4621", "main"]
    tags: ["v*"] # pushing a tag like v0.1.0 publishes a versioned release
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a versioned release with this tag (e.g. v0.1.0). Leave blank to just build."
        required: false
        default: ""
  release:
    types: [created]

# Needed so the build can publish ACTIG-Setup.exe to a GitHub Release for direct download.
permissions:
  contents: write

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend (dev)
        run: pip install -e "backend[dev]"
      - name: Run tests
        working-directory: backend
        run: pytest -q

  build-windows:
    runs-on: windows-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pnpm
        run: npm install -g pnpm@9

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up MSVC (for the native wallpaper helper)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build native wallpaper helper
        shell: pwsh
        run: pwsh installer/native/build-native.ps1
        continue-on-error: true

      # 1) Standard build (text + browser speech + OS TTS). Stash it aside.
      - name: Build standard installer
        shell: pwsh
        env:
          ACTIG_WITH_VOICE: "0"
        run: |
          node installer/build.mjs
          Move-Item -Force installer/output/ACTIG-Setup.exe installer/output/_standard.exe

      # 2) Full offline-voice build (faster-whisper / Piper / openWakeWord bundled).
      #    Heavy; if it fails we still ship the standard exe, so don't fail the job.
      - name: Build offline-voice installer
        shell: pwsh
        continue-on-error: true
        env:
          ACTIG_WITH_VOICE: "1"
        run: |
          node installer/build.mjs
          Move-Item -Force installer/output/ACTIG-Setup.exe installer/output/ACTIG-Setup-voice.exe

      # 3) Restore the standard exe to its canonical name.
      - name: Finalize installer names
        shell: pwsh
        run: Move-Item -Force installer/output/_standard.exe installer/output/ACTIG-Setup.exe

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ACTIG-Setup
          path: |
            installer/output/ACTIG-Setup.exe
            installer/output/ACTIG-Setup-voice.exe
          if-no-files-found: error

      # Rolling pre-release with a stable direct-download link on every branch push.
      - name: Publish latest-build release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: ACTIG latest build
          prerelease: true
          files: |
            installer/output/ACTIG-Setup.exe
            installer/output/ACTIG-Setup-voice.exe

      # A versioned release is cut either by pushing a v* tag OR by running the workflow
      # manually with a release_tag input (used when tag pushes aren't available).
      - name: Resolve version tag
        id: ver
        shell: bash
        run: |
          TAG=""
          # 1) explicit v* tag push, 2) manual dispatch input, 3) fall back to package.json
          # version on a branch push so a normal push publishes the versioned release too.
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then TAG="${{ github.ref_name }}"; fi
          if [[ -n "${{ github.event.inputs.release_tag }}" ]]; then TAG="${{ github.event.inputs.release_tag }}"; fi
          if [[ -z "$TAG" && "${{ github.event_name }}" == "push" ]]; then
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish versioned release
        if: steps.ver.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ACTIG ${{ steps.ver.outputs.tag }}
          files: |
            installer/output/ACTIG-Setup.exe
            installer/output/ACTIG-Setup-voice.exe
          body: |
            ## ACTIG ${{ steps.ver.outputs.tag }}

            Two installers — copy either to a Windows PC and double-click to install.
            (Unsigned: on the SmartScreen prompt choose **More info → Run anyway**.)

            | Asset | What it includes |
            |---|---|
            | **ACTIG-Setup.exe** | Standard build. Text chat + browser speech-to-text + OS (SAPI) text-to-speech. Smaller, fastest to install. |
            | **ACTIG-Setup-voice.exe** | Bundles the on-device **offline voice stack** — faster-whisper (STT), Piper (TTS), openWakeWord. Larger. The Whisper model downloads on first run; add Piper voices and the custom "wake up ACTIG" model under `assets/` per the docs for a fully-offline wake word. |

            Both auto-start on boot and run in the tray. Wake with **"wake up ACTIG"**, the
            floating emergency button, or **Ctrl+Alt+Space**.
